<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astro Tech · 3D Photo Animation</title>
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23ffd257'/></svg>"
  />
  <link rel="stylesheet" href="./styles/style.css" />
</head>
<body>
  <div id="loader" aria-live="polite">
    <div class="loader__ring"></div>
    <p>Building depth…</p>
  </div>

  <p id="caption" class="caption">3D photo · move the cursor / tilt your device</p>

  <!-- renderer.domElement is appended to <body> by main.js -->

  <!-- three.js + GSAP vendored locally (offline). -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
  <script src="./vendor/gsap.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
