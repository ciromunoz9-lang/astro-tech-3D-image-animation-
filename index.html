<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astro Tech · 3D Image Animation</title>
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23ffd257'/></svg>"
  />
  <link rel="stylesheet" href="./styles/style.css" />
</head>
<body>
  <div id="loader" aria-live="polite">
    <div class="loader__ring"></div>
    <p>Loading footage…</p>
  </div>

  <!-- Click-to-start fallback if the browser blocks muted autoplay -->
  <button id="playgate" class="playgate" hidden aria-label="Play">
    <span class="playgate__icon"></span>
    <span class="playgate__label">Tap to enter</span>
  </button>

  <!-- Source video for the THREE.VideoTexture. Hidden; drawn onto the
       3D plane. muted + playsinline + loop enables mobile autoplay. -->
  <video
    id="source"
    muted
    loop
    playsinline
    preload="auto"
    crossorigin="anonymous"
  >
    <source src="./assets/astronaut.mp4" type="video/mp4" />
    <source src="./assets/astronaut.webm" type="video/webm" />
  </video>

  <p id="caption" class="caption">GSAP camera in 3D · drag / move the cursor</p>

  <!-- renderer.domElement is appended to <body> by main.js -->

  <!-- three.js + GSAP are vendored locally in /vendor (offline). -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
  <script src="./vendor/gsap.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
